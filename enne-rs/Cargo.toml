[package]
name = "enne-rs"
version = "25.0.0"
edition = "2024"
description = "ENNE (Engineering Neural Network Engine): CPU text-only Rust implementation (v25.0)"
license = "MIT"

[dependencies]
nalgebra = { version = "0.34", default-features = false, features = ["std"] }
matrixmultiply = "0.3"
bytemuck = "1"
anyhow = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
chrono = "0.4"
unicode-normalization = "0.1"
rayon = "1"

[profile.release]
lto = "thin"
opt-level = 3
