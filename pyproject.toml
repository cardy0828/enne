[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "enne"
version = "25.0.0"
description = "ENNE (Engineering Neural Network Engine): backprop-free growing byte-DAG language system (Python v15.2 + Rust CPU v25.0)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["numpy", "torch", "triton"]

[tool.setuptools]
package-dir = { "" = "src" }
packages = ["neurograph"]

[tool.setuptools.package-data]
neurograph = ["*.cpp"]
